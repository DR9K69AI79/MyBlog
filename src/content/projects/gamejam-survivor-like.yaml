longDescription: |
  初次接触 Unity ，48 小时 GameJam 作品，类吸血鬼幸存者的 2D roguelike 游戏。
  实现了玩家控制器，敌人攻击逻辑，敌人生成逻辑，背景视差滚动，以及开始页面等等。
  使用 Asprite 绘制了像素风格的飞船与喷火特效序列帧动画。
