highlights:
  - 模块化战斗系统 (FSM + ScriptableObject 数据驱动)
  - 多敌人 AI 调度 (排队攻击机制)
  - 多点碰撞攻击检测 (骨骼层级碰撞)
  - 完整三区域关卡流程
