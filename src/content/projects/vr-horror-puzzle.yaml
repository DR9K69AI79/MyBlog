id: vr-horror-puzzle
displayName: VR Horror Puzzle
description: 基于 OpenXR 开发的 PCVR 恐怖解谜游戏，三个差异化玩法关卡逐步升级心理压力
longDescription: |
  使用 Unity + OpenXR API 开发的 PCVR 游戏，使用 Meta Quest3 有线串流测试。
  三个差异化玩法关卡：环境探索解谜、监控室防守 (类玩具熊五夜后宫)、无限循环走廊 (类8号出口)。
  基于物理组件 (Joint) 实现可交互机关 (抽屉、保险箱等)，增强 VR 体验真实感。
  基于 RT 实时渲染画面实现可交互监控摄像头系统。
timeText: "2024年9月 - 2024年11月"
status: completed
visibility:
  homepage: true
  portfolio: true

