id: endless-runner
displayName: Endless Runner
description: 类地铁跑酷的三道式跑酷游戏，针对移动端优化
longDescription: |
  触屏操作控制人物变道、跳跃、滑铲，配合动画、音效与特效。
  轻量 ObjectPool 类动态加载道路块与背景资产。
  DFS 与回溯算法随机生成合适障碍物，避免死路。
  可转向十字路口道路块，数学计算匹配正确道路与无尽生成。
