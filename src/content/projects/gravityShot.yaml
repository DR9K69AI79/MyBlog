id: gravityShot
displayName: GravityShot
description: 基于Unity + Photon Pun2的FPS游戏Demo项目，核心特点为可变重力。
showOnHomepage: true
modelType: cube
# modelPath: '/models/gravityShot_project.glb'
color: '#7c3aed'
modelParams:
  # 缩放：完全由用户控制，建议值0.5-3.0
  scale: 0.8
  rotation:
    # 初始旋转角度（弧度）
    x: 0.4
    y: 0
    z: 0
  position:
    # 3D空间中的位置偏移，可用于精确定位
    x: 0
    y: 0
    z: 0 # 正值向前，负值向后
  material:
    metalness: 0.8
    roughness: 0.1
    opacity: 1.0
    transparent: true
    wireframe: false
  lighting:
    intensity: 2
    ambientIntensity: 1
    enableShadows: true
  animation:
    autoRotate: true
    rotationSpeed: 0.8
    bounceEnabled: true
projectUrl: 'https://github.com/DR9K69AI79/MyBlog'
cover: 'https://images.unsplash.com/photo-1634078622491-93312b54636c?w=800&h=400&fit=crop'
tags: ['Unity', 'MultiPlayer', 'Photon Pun2', 'FPS']
category: 'Unity'
timeText: '2025年6月 ~ 7月'
