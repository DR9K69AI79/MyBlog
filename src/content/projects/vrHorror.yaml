id: vrHorror
displayName: VR Horror Game
description: 基于Unity与OpenXR SDK的VR恐怖游戏项目，共三个关卡涉及到三种不同的玩法。使用Quest3有线串流测试。
showOnHomepage: true
modelType: custom
modelPath: '/models/vrHorrorGame_project.glb'
color: '#7c3aed'
modelParams:
  # 缩放：完全由用户控制，建议值0.5-3.0
  scale: 1.25
  rotation:
    # 初始旋转角度（弧度）
    x: 0.2
    y: 0
    z: 0
  position:
    # 3D空间中的位置偏移，可用于精确定位
    x: 0
    y: -0.1
    z: 0 # 正值向前，负值向后
  material:
    metalness: 0.6
    roughness: 0.4
    opacity: 1.0
    transparent: true
    wireframe: false
  lighting:
    intensity: 2
    ambientIntensity: 1
    enableShadows: true
  animation:
    autoRotate: false
    rotationSpeed: 1.0
    bounceEnabled: true
projectUrl: 'https://github.com/DR9K69AI79/MyBlog'
cover: 'https://images.unsplash.com/photo-1634078622491-93312b54636c?w=800&h=400&fit=crop'
tags: ['Unity', 'VR', 'OpenXR SDK']
category: 'Unity'
timeText: '2024年10月 ~ 11月'
